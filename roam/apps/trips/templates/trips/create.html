<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ROAM</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
	        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
	        crossorigin="anonymous"></script>
</head>
<body>
<h1 class="text-center mb-3">ROAM</h1>
<h2 class="text-center mb-3">Add a new trip</h2>
<div class="container">
	<form method="post">
		{% csrf_token %}
		<div class="mb-3">
			<label for="name" class="form-label">Trip Name</label>
			<input type="text" class="form-control" id="name" name="name" required>
		</div>
		<div class="mb-3">
			<label for="destination" class="form-label">Destination</label>
			<input type="text" class="form-control" id="destination" name="destination" required>
		</div>
		<div class="mb-3">
			<label for="start_date" class="form-label">Start date</label>
			<input type="date" class="form-control" id="start_date" name="start_date" required>
		</div>
		<div class="mb-3">
			<label for="end_date" class="form-label">End date</label>
			<input type="date" class="form-control" id="end_date" name="end_date" required>
		</div>
		<div class="mb-3">
			<label for="{{ form.status.id_for_label }}" class="form-label">Status</label>
			{{ form.status }}
		</div>
		<div class="mb-3">
			<label for="description" class="form-label">Description</label>
			<textarea class="form-control" rows="5" name="description" required></textarea>
		</div>
		<div class="mb-3">
			<label for="rating" class="form-label">Rating over 10</label>
			<input type="number" class="form-control" name="rating" min="0" max="10" step="1">
		</div>
		<div class="text-center">
			<input class="btn btn-primary" type="submit" value="Add trip">
		</div>
	</form>
	<div class="d-flex justify-content-center mt-4">
		<a href="{% url 'trips:index' %}" class="btn btn-danger">Cancel</a>
	</div>
</div>
</body>
</html>
