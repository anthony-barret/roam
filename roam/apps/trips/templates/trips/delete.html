<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ROAM</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
	      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
	        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
	        crossorigin="anonymous"></script>
</head>
<body>
<h1 class="text-center mb-3">ROAM</h1>
<div class="d-flex justify-content-center mb-4">
	<a class="btn btn-primary" href="{% url 'trips:index' %}" role="button">Homepage</a>
</div>
<div class="container py-4">
	<div class="row justify-content-center">
		<div class="col-lg-6">
			<div class="card">
				<div class="card-body">
					<h1 class="card-title mb-3">Delete trip</h1>
					<p>Are you sure you want to delete <strong>{{ trip.name }}</strong>?</p>
					<p class="text-danger">This action cannot be undone.</p>
					<form method="post">
						{% csrf_token %}
						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-danger">Delete trip</button>
							<a href="{% url 'trips:detail' trip.pk %}" class="btn btn-secondary">Cancel</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
