{% extends "trips/base.html" %}
{% block content %}
<div class="container-fluid px-4">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1 class="h2 mb-1">My travel map</h1>
			<p class="text-muted mb-0">
				Explore the places you've visited.
			</p>
		</div>
	</div>
	<div id="map" role="application" aria-label="Interactive map of your trips"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
{% load static %}
<script src="{% static 'trips/js/map.js' %}"></script>
{% endblock %}
